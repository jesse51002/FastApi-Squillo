repos:
  - repo: local
    hooks:
      - id: format
        name: make format
        entry: make format
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: lint
        name: make lint
        entry: make lint
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
