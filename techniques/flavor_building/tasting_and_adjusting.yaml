name: Tasting & Adjusting
description: Continuously tasting and seasoning food throughout cooking
difficulty: 2
tips:
- Taste frequently as you cook
- Adjust salt, acid, sweetness, heat
- Season in layers, not all at once
- Remember flavors concentrate as liquids reduce
- Temperature affects taste - taste at serving temperature
- Use small additions and taste between adjustments
