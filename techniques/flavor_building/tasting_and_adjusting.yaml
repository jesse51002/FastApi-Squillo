name: Tasting & Adjusting
description: Tasting food frequently during cooking to adjust salt, acid, sweetness, and heat through small incremental additions, allowing you to correct flavors before they concentrate further. Remember that flavors intensify as liquids reduce and change as temperature changes, so always taste at serving temperature for accurate seasoning.
difficulty: 2
tips:
- Taste frequently as you cook
- Adjust salt, acid, sweetness, heat
- Season in layers, not all at once
- Remember flavors concentrate as liquids reduce
- Temperature affects taste - taste at serving temperature
- Use small additions and taste between adjustments
