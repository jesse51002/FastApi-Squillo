name: Acid Balance
description: Adding acidic ingredients like lemon, lime, vinegar, wine, or tomatoes to balance rich, fatty, or overly sweet dishes while adding brightness to dull flavors. Acids are typically added near the end of cooking to preserve their fresh, sharp flavor and work best when added in small amounts that can be tasted and adjusted.
difficulty: 2
tips:
- Acids include lemon, lime, vinegar, wine, tomatoes
- Balance rich, fatty, or sweet dishes
- Add brightness to dull flavors
- Often added at end of cooking to preserve fresh flavor
- Start with small amounts and taste
- Can't remove acid if over-added
