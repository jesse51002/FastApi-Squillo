id: 543a2d7e-6921-4285-a46f-700859b4db99
name: Stock Making
description: Simmering bones, vegetables, and aromatics to extract flavors into liquid
difficulty: 3
tips:
- Chicken, beef, vegetable, or fish stocks
- Simmer bones and aromatics 2-24 hours (depends on type)
- Don't boil - keeps stock clear
- Skim impurities
- Strain and cool quickly
- Foundation for soups, sauces, risotto
- Superior to store-bought
- Freeze in portions
