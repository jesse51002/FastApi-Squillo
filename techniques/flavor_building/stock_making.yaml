id: 543a2d7e-6921-4285-a46f-700859b4db99
name: Stock Making
description: Simmering bones (chicken, beef, fish) with vegetables and aromatics for 2-24 hours at low temperature to extract deep flavors and create a foundation superior to store-bought stock. Stock must be simmered gently without vigorous boiling, with impurities skimmed off, then strained and cooled quickly for use in soups, sauces, and risottos, making it a cornerstone technique in professional cooking.
difficulty: 3
tips:
- Chicken, beef, vegetable, or fish stocks
- Simmer bones and aromatics 2-24 hours (depends on type)
- Don't boil - keeps stock clear
- Skim impurities
- Strain and cool quickly
- Foundation for soups, sauces, risotto
- Superior to store-bought
- Freeze in portions
