id: 42628d94-b6a9-40c3-8c91-5b0ebef10c6f
name: Fresh vs Dried Herbs
description: Using dried herbs (1/3 the amount of fresh) added early in cooking to rehydrate and release their concentrated flavor, versus fresh herbs added near the end to preserve bright, delicate flavors. Some herbs like oregano dry well and remain flavorful, while others like basil are best used fresh to avoid losing their distinctive character.
difficulty: 1
tips:
- Dried herbs are more concentrated - use 1/3 the amount of fresh
- Add dried herbs early in cooking to rehydrate and release flavor
- Add fresh herbs near the end to preserve bright flavor, or as garnish
- Some herbs like oregano dry well, others like basil are best fresh
