name: Aromatics
description: Cooking aromatic vegetables like onions, garlic, ginger, celery, carrots, and peppers as the first step to build a flavor foundation, with regional combinations such as French mirepoix, Cajun trinity, or Spanish sofrito. These ingredients are always cooked first because their flavors meld together to create the base that all other flavors build upon.
difficulty: 1
tips:
- Common aromatics include onions, garlic, ginger, celery, carrots, peppers
- 'French mirepoix: onion, celery, carrot'
- 'Cajun trinity: onion, celery, bell pepper'
- 'Sofrito: onion, garlic, peppers, tomatoes'
- Cook aromatics first to build flavor base
