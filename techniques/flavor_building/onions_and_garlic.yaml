name: Onions and garlic
description: Cooking onions and garlic gently and properly to create the flavor foundation for countless dishes across world cuisines, with garlic requiring careful, low heat to avoid bitterness while onions can be translucent-cooked for subtle flavor or caramelized for deep sweetness. These aromatics are the first step in nearly all savory cooking because they build the base upon which all other flavors develop.
difficulty: 1
tips:
- These aromatics form the flavor base for countless cuisines
- Cook garlic gently to avoid bitterness - it burns easily
- Onions should be cooked until translucent or caramelized depending on the desired
  flavor profile
