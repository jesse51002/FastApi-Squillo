id: 1c4c4f40-2bca-4b13-b970-5e08179bd6b2
name: Liquid Reduction
description: Simmering liquid uncovered to evaporate water and concentrate flavors, typically reducing by half or more to create intensely flavored sauces, stocks, and glazes. Care must be taken to monitor salt concentration, which also intensifies during reduction, and to taste frequently as liquid evaporates faster in wide pans.
difficulty: 2
tips:
- Simmer uncovered to evaporate water, concentrating flavor and thickening texture
- Reduce by half or more
- Taste as you go - flavors intensify
- Watch salt levels - they concentrate too
- Use for sauces, stocks, glazes
- Wide pan reduces faster than narrow
