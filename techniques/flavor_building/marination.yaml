id: 0aed3ad6-79f1-4327-8e1d-e7e4232d0033
name: Marination
description: Soaking food in a marinade containing acid (lemon, vinegar), oil, and seasonings for 30 minutes to overnight to infuse flavor and tenderize proteins, with timing depending on protein size and type. The acid component tenderizes by breaking down proteins, but excessive marinating time can make meat mushy, so careful timing is essential for best results.
difficulty: 2
tips:
- Marinades typically include acid (lemon, vinegar), oil, and seasonings
- Acid tenderizes but too long can make meat mushy. 30 minutes to overnight depending
  on protein size
- Always refrigerate while marinating
- Don't reuse marinade that touched raw meat
- Pat dry before cooking for better browning
