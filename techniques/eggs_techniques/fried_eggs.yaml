id: f9738d95-e242-4024-b9c0-3cb7cd7a9e61
name: Fried Eggs
description: Cooking unbeaten eggs in butter or oil at medium-low heat with multiple doneness options (sunny side up, over easy, over medium, over hard) controlled by flipping and heat duration. Unlike scrambled eggs which are constantly stirred or omelets which are folded, fried eggs are largely undisturbed to develop crispy edges while maintaining the desired yolk consistency.
difficulty: 2
tips:
- 'Sunny side up: cooked on one side only'
- 'Over easy: flipped briefly, runny yolk'
- 'Over medium: slightly firmer yolk'
- 'Over hard: fully cooked yolk'
- Use medium-low heat and butter or oil
- Cover briefly to set whites while keeping yolk runny
