name: Egg Cracking
description: Breaking eggs cleanly without shell fragments
difficulty: 1
tips:
- Crack eggs on a flat surface (not bowl rim) for cleaner breaks
- Use one swift tap to create a crack, then pull apart gently with both thumbs
- Crack into a separate bowl first to check for shells or bad eggs
