name: Omelette
description: Cooking beaten eggs in butter at medium-high heat with gentle stirring until mostly set, then adding fillings and folding or rolling into a finished dish that can be served with no browning (French style) or light browning (American style). Unlike scrambled eggs which create small curds, omelets create a cohesive structure that can be filled, making it a more substantial dish.
difficulty: 3
tips:
- Beat eggs until just combined
- Use medium-high heat with butter
- Stir gently as eggs set, then let bottom cook undisturbed
- Add fillings when mostly set, then fold or roll
- French omelette is rolled with no browning, American is folded with slight color
