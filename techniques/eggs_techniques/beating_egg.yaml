name: Beating egg
description: Mixing eggs to incorporate air and combine whites and yolks
difficulty: 1
tips:
- Use a fork or whisk in a rapid circular motion
- Beat until yolks and whites are fully combined with no streaks
- For scrambled eggs, beat until just combined
- For omelets, beat until slightly frothy for lighter texture
