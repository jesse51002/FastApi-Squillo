id: 21819ae7-1592-4e08-a8b4-cb1b03dbad7e
name: Boiled Eggs
description: Boiling whole eggs in their shells for precise doneness levels (soft-boiled 6-7 minutes, medium 8-10, hard 11-13) by controlling cooking time and using an ice bath to stop the cooking process. This dry-heat free method produces perfectly cooked eggs that are easy to peel and serve hot or cold, distinct from fried eggs which use fat and direct heat.
difficulty: 1
tips:
- 'Soft boiled: 6-7 minutes, medium: 8-10 minutes, hard: 11-13 minutes'
- Start with cold or boiling water (adjust time accordingly)
- Ice bath immediately after cooking stops the cooking process and makes peeling easier
