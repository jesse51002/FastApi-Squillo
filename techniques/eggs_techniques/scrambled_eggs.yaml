name: Scrambled eggs
description: Beating and cooking eggs into soft curds
difficulty: 2
tips:
- Beat eggs with a splash of milk or cream
- Use low heat and constant stirring for creamy, small curds
- Remove from heat while slightly underdone - residual heat will finish cooking
- French style uses very low heat for ultra-creamy texture
