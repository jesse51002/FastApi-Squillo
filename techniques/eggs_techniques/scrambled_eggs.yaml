name: Scrambled eggs
description: Cooking beaten eggs with milk or cream at low heat with constant stirring to create soft, small curds, removing from heat while slightly underdone so residual heat finishes cooking without overcooking. This gentle approach creates creamier results than high-heat scrambling, with French-style scrambled eggs using extra-low heat for the creamiest, most delicate texture.
difficulty: 2
tips:
- Beat eggs with a splash of milk or cream
- Use low heat and constant stirring for creamy, small curds
- Remove from heat while slightly underdone - residual heat will finish cooking
- French style uses very low heat for ultra-creamy texture
