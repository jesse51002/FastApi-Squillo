name: Boiling Rice
description: Cooking rice using either the absorption method (precise water ratio, covered and simmering) or boiling method (like pasta with excess water to drain), with the absorption method providing better flavor control and texture. Unlike pasta boiling which needs vigorous heat and precise timing, rice cooking relies on controlled heat and liquid ratios for consistent, fluffy results.
difficulty: 2
tips:
- 'Absorption method: 2:1 water to rice ratio (varies by type), bring to boil, cover,
  reduce to low, cook 15-20 minutes, let rest 5 minutes'
- 'Boiling method: cook like pasta in lots of water, drain when done'
- Rinse rice first to remove excess starch
