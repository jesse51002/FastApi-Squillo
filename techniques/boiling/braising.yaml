id: d344521d-f0bf-450a-aac9-38ce6aae1d2d
name: Braising
description: Cooking food slowly in a small amount of liquid in a covered pot
difficulty: 3
tips:
- 'Combination method: sear first, then simmer in liquid'
- Low heat (300-350°F) for long time
- Typically 2-4 hours
- Liquid should come 1/3 to 1/2 way up food
- Tenderizes tough cuts of meat
- Pot roast, short ribs, osso buco are classic braises
