id: d344521d-f0bf-450a-aac9-38ce6aae1d2d
name: Braising
description: A combination method where food is seared first for color and flavor, then simmered in a small amount of liquid (1/3 to 1/2 way up the food) at low heat (300-350°F) for 2-4 hours to tenderize tough cuts. Unlike stewing which fully submerges food in liquid, braising uses less liquid and often browses the exposed top of the food in the oven.
difficulty: 3
tips:
- 'Combination method: sear first, then simmer in liquid'
- Low heat (300-350°F) for long time
- Typically 2-4 hours
- Liquid should come 1/3 to 1/2 way up food
- Tenderizes tough cuts of meat
- Pot roast, short ribs, osso buco are classic braises
