name: Stewing
description: Simmering meat and vegetables completely submerged in liquid at low heat, with smaller cut pieces than braising, creating deeply flavored dishes where the cooking liquid is thickened and served as the sauce. Unlike braising which partially covers food and often finishes in the oven, stewing keeps everything fully immersed and relies entirely on moist heat for the entire cooking time.
difficulty: 2
tips:
- Similar to braising but food is fully submerged and cut into smaller pieces
- Low, slow cooking develops deep flavors
- Tenderizes tough cuts
- Vegetables and aromatics add flavor to liquid
- Stews are often thickened and served with the cooking liquid
