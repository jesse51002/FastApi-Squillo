name: Stewing
description: Simmering food completely covered in liquid
difficulty: 2
tips:
- Similar to braising but food is fully submerged and cut into smaller pieces
- Low, slow cooking develops deep flavors
- Tenderizes tough cuts
- Vegetables and aromatics add flavor to liquid
- Stews are often thickened and served with the cooking liquid
