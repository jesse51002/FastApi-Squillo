id: 70d52afb-91b3-436b-b6cb-b0dfd2bc18cd
name: Boiling Pasta
description: Cooking pasta in abundantly salted boiling water until al dente (tender but firm) to create properly seasoned, evenly cooked noodles. Unlike rice boiling which relies on absorption, pasta boiling requires constant rolling boil and careful timing to achieve the ideal texture.
difficulty: 1
tips:
- Use 4-6 quarts water per pound of pasta
- Salt generously (1-2 tablespoons)
- Wait for rolling boil before adding pasta
- Stir occasionally to prevent sticking
- Test for al dente - tender but firm
- Save pasta water for sauce
- Don't rinse unless making cold salad
