name: Steaming
description: Cooking food with steam from gently simmering water without direct contact with the liquid, preserving nutrients, color, and delicate texture ideal for vegetables, dumplings, and fish. Unlike boiling where food absorbs excess water, steaming keeps food dry and retains its natural flavors and nutritional value.
difficulty: 1
tips:
- Gentle cooking method that preserves nutrients, color, and texture
- Food doesn't touch water
- Use bamboo or metal steamer basket
- Water should simmer, not boil vigorously
- Great for vegetables, dumplings, fish
- Season food before steaming or water afterward
