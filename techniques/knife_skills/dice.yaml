name: Dice
description: Cutting food into small, uniform cubes
difficulty: 2
tips:
- First slice the ingredient, then stack and cut into strips, finally cut across to
  create cubes
- Common sizes are small (1/4 inch), medium (1/2 inch), and large (3/4 inch) dice
