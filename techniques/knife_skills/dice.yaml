name: Dice
description: Creating uniform cubes by first slicing the ingredient, then stacking and cutting into strips, finally cutting across to form cubes in standard sizes (small 1/4 inch, medium 1/2 inch, large 3/4 inch). Uniform dice is essential because all pieces cook at the same rate, ensuring even doneness throughout the dish.
difficulty: 2
tips:
- First slice the ingredient, then stack and cut into strips, finally cut across to
  create cubes
- Common sizes are small (1/4 inch), medium (1/2 inch), and large (3/4 inch) dice
