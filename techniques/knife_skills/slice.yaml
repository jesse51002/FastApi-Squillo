name: Slice
description: Using smooth forward and downward knife motions to cut food into thin, uniformly thick pieces, with thickness determined by cooking method—thin slices for quick cooking and thicker slices for roasting or grilling. Uniform thickness ensures even cooking throughout the ingredient.
difficulty: 1
tips:
- Use a smooth forward and downward motion
- Keep slices uniform for even cooking
- Thickness varies by recipe - thin slices for quick cooking, thicker for roasting
  or grilling
