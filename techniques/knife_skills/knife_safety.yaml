id: 233fbd9b-2ef5-4240-ba12-3ec6ff6553df
name: Knife Safety
description: Essential safety practices when handling kitchen knives to prevent accidents
  and injuries
difficulty: 1
tips:
- Always cut away from your body, keep knives sharp (dull knives are more dangerous),
  use a stable cutting board, and maintain focus while cutting
- The claw grip protects fingers while cutting
