name: Dice Onion
description: Dicing onions efficiently by cutting from root to tip (minimizing cell damage and tears), leaving the root intact while making horizontal and vertical cuts, then slicing across for uniform dice. Refrigerating onions before cutting dramatically reduces the irritating sulfur compounds released into the air, making the task more pleasant.
difficulty: 2
tips:
- Cut root to tip to minimize cell damage and reduce tears
- Leave root end intact while making horizontal and vertical cuts, then slice across
  for uniform dice
- Refrigerate onions before cutting to reduce crying
