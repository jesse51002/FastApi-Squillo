name: Chopping cylinder object
description: Techniques for cutting cylindrical vegetables like carrots and cucumbers
difficulty: 2
tips:
- Cut at an angle for oblique cuts, or straight across for rounds
- For stability, cut a thin slice lengthwise to create a flat base before making additional
  cuts
- Roll cutting creates more surface area for cooking
