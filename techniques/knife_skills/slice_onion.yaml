name: Slice Onion
description: Slicing onions thinly from root to tip (minimizing cell damage and tears) while leaving the root intact to hold the layers together during cutting. Refrigerating onions before slicing dramatically reduces the irritating sulfur compounds released during cutting, making this an easy technique to improve both food quality and cooking comfort.
difficulty: 2
tips:
- Cut root to tip to minimize cell damage and reduce tears
- Leave root end intact while making horizontal and vertical cuts, then slice across
  for uniform dice
- Refrigerate onions before cutting to reduce crying
