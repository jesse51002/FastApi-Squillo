id: 26441e62-7ef3-47ba-a2e0-4b6c4c6f37e8
name: Slice Meat
description: Understanding how to slice meat
difficulty: 3
tips:
- Different cuts require different methods
- Tender cuts (ribeye, tenderloin) high heat, quick cooking
- 'Tough cuts (chuck, brisket): low and slow'
- Look for marbling in beef
- Bring to room temperature before cooking
- Pat dry for better sear
- Use thermometer for doneness
