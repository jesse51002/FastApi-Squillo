name: Mince
description: Cutting food into very fine pieces, smaller than a dice
difficulty: 2
tips:
- Use a rocking motion with the knife, keeping the tip on the board
- Common for garlic, herbs, and ginger
- The finer the mince, the more flavor is released into the dish
