id: 535594f5-b838-471e-a1bf-2d6a6c3a0e68
name: Mince
description: Creating very fine pieces (smaller than dice) using a rocking knife motion with the tip anchored on the board, commonly applied to garlic, herbs, and ginger. The finer the mince, the more surface area is exposed and flavor is released into the dish, making this technique valuable for maximizing flavor from potent aromatics.
difficulty: 2
tips:
- Use a rocking motion with the knife, keeping the tip on the board
- Common for garlic, herbs, and ginger
- The finer the mince, the more flavor is released into the dish
