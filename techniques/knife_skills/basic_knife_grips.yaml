id: 8217d8dd-ae2a-4ceb-ae54-c42028729af4
name: Basic knife grips
description: Mastering the two essential knife grips. the handle grip (pinching the blade near the bolster with thumb and forefinger while wrapping other fingers around the handle) for cutting control, and the claw grip for the guiding hand to protect fingertips. These fundamental grips provide the foundation for safe, efficient cutting and must be practiced until they become natural.
difficulty: 1
tips:
- The most common grip is the handle grip (握り方) where you pinch the blade near the
  bolster with thumb and forefinger, wrapping other fingers around the handle
- The claw grip is used for the guiding hand to protect fingertips
