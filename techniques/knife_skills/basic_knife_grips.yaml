name: Basic knife grips
description: Fundamental ways to hold a chef's knife for control and efficiency
difficulty: 1
tips:
- The most common grip is the handle grip (握り方) where you pinch the blade near the
  bolster with thumb and forefinger, wrapping other fingers around the handle
- The claw grip is used for the guiding hand to protect fingertips
