name: Baking
description: Cooking food with dry heat in an oven at moderate temperatures
difficulty: 2
tips:
- Typically 300-375°F
- More gentle than roasting
- Used for breads, pastries, casseroles
- Preheat oven for consistent results
- Position matters - center rack for even heat, top for browning, bottom for crisping
- Don't open oven door frequently
