name: Baking
description: Cooking food with dry heat in an oven at moderate temperatures (typically under 400°F), using gentler heat than roasting to create tender results ideal for breads, pastries, and casseroles. Unlike roasting's high-temperature browning, baking's moderate heat emphasizes even cooking and rise rather than caramelization.
difficulty: 2
tips:
- More gentle than roasting
- Used for breads, pastries, casseroles
- Preheat oven for consistent results
- Position matters - center rack for even heat, top for browning, bottom for crisping
- Don't open oven door frequently
