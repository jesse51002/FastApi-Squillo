id: 825cf293-0147-4226-8a77-2b1970c8c001
name: Roasting
description: Cooking food with dry heat in an oven at high temperatures (400°F or higher) to develop deep flavors through caramelization and Maillard reaction, especially for vegetables, meats, and poultry. Unlike baking's moderate heat and gentler approach, roasting uses aggressive heat to create flavorful browning and crispy exteriors.
difficulty: 2
tips:
- Usually 400°F or higher
- Develops deep flavors through caramelization and Maillard reaction
- Good for vegetables, meats, and poultry
- Turn food occasionally for even browning
- Use a roasting rack for air circulation
- Let meat rest after roasting
