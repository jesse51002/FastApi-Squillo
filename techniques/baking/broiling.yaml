name: Broiling
description: Cooking with direct heat from above at very high temperature
difficulty: 2
tips:
- Essentially upside-down grilling
- Very high heat (500-550°F)
- Position food 3-6 inches from element depending on thickness
- Watch constantly - food can burn quickly
- Great for finishing dishes, melting cheese, or quick cooking thin items
