name: Broiling
description: Cooking with direct heat from above at very high temperatures (500-550°F), essentially upside-down grilling perfect for quick cooking, melting cheese, or finishing dishes. Unlike roasting which cooks from all sides, broiling delivers intense direct heat from above for rapid browning with minimal cooking time.
difficulty: 2
tips:
- Essentially upside-down grilling
- Very high heat (500-550°F)
- Position food 3-6 inches from element depending on thickness
- Watch constantly - food can burn quickly
- Great for finishing dishes, melting cheese, or quick cooking thin items
