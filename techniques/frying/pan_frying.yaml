id: 02e8dca5-32d4-4463-8e6e-f22817c22abe
name: Pan Frying
description: Cooking food in a moderate amount of oil in a pan
difficulty: 2
tips:
- Uses more oil than sautéing but less than deep frying - typically 1/4 to 1/2 inch
  of oil
- Medium to medium-high heat
- Good for breaded items, achieving golden-brown exterior while cooking through
- Don't overcrowd the pan or temperature will drop
