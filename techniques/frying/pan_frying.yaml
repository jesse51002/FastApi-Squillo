name: Pan Frying
description: Using 1/4 to 1/2 inch of oil at medium-high heat to create a crispy exterior on foods like chicken cutlets, fish fillets, and breaded items while cooking them through. Pan frying strikes a balance between sautéing (minimal fat with constant movement) and deep frying (complete submersion), making it ideal for achieving crispy, golden results without full deep-frying.
difficulty: 2
tips:
- Uses more oil than sautéing but less than deep frying - typically 1/4 to 1/2 inch
  of oil
- Don't overcrowd the pan or temperature will drop
