id: 23615c73-c662-429d-8fa4-e75e2f2d469d
name: Deep Frying
description: Fully submerging food in oil heated to 350-375°F to create a crispy exterior while cooking the interior, requiring a thermometer for accuracy and careful attention to oil temperature. Double frying (cooking, resting, then frying again) achieves extra-crispy textures and is superior to single frying, making this technique ideal for achieving restaurant-quality fried foods.
difficulty: 3
tips:
- Oil temperature typically 350-375°F
- Use a thermometer for accuracy
- Don't overcrowd - it lowers temperature
- Food should float when done
- Drain on wire rack or paper towels
- Double frying (fry, rest, fry again) creates extra crispy texture
