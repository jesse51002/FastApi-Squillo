name: Deglazing
description: After searing meat, removing the protein and adding wine, stock, water, or vinegar to the hot pan to dissolve the flavorful browned bits (fond) and scrape them up with a wooden spoon. These browned bits are products of the Maillard reaction and are concentrated pure flavor that forms the perfect foundation for pan sauces.
difficulty: 2
tips:
- After searing meat, remove protein, add wine/stock/water to hot pan, scrape up brown
  bits with wooden spoon
- These bits are pure flavor (Maillard reaction products)
- Forms base for pan sauces
- Use wine, stock, vinegar, or even water
