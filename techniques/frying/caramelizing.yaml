id: 32b775f4-1822-4004-be97-dd50baadc828
name: Caramelizing
description: Cooking sugars or sugar-containing foods like onions at low to medium heat until they brown, developing complex layered flavors that combine deep sweetness with subtle bitter notes. This patient technique (30-45 minutes for onions) must never be rushed with high heat or the sugars will burn, destroying the nuanced caramel flavors.
difficulty: 3
tips:
- 'Dry caramelization: sugar heated until melted and browned'
- 'Caramelized onions: slow cooking breaks down sugars and browns'
- Low to medium heat
- Takes patience - 30-45 minutes for onions
- Develops deep, sweet, complex flavors
- Don't rush with high heat or they'll burn
