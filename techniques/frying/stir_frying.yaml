name: Stir Frying
description: Rapidly cooking small, uniformly cut pieces of food over very high heat in a wok or large skillet with constant stirring, a traditional Asian technique that develops big flavors with minimal oil. Success requires all ingredients prepped before cooking begins and ingredients added in order of cooking time (longest-cooking items first) because the intense, fast-moving heat cooks everything in minutes.
difficulty: 3
tips:
- Traditional in Asian cuisine, uses a wok or large skillet
- Very high heat, constant motion
- Prep all ingredients before starting - cooking happens fast
- Add ingredients in order of cooking time (longest first)
- Small amount of oil, big flavor
