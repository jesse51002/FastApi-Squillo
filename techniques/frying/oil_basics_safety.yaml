id: e541b328-b23a-4ada-a675-341f10e3d44b
name: Oil basics & Safety
description: Selecting cooking oils with appropriate smoke points for different heat levels (vegetable, canola, and peanut oil for high-heat cooking) and practicing critical safety measures including never leaving hot oil unattended and keeping a lid nearby for emergencies. Proper oil handling prevents dangerous fires and ensures the best cooking results while maintaining kitchen safety.
difficulty: 1
tips:
- Different oils have different smoke points - use high smoke point oils (vegetable,
  canola, peanut) for high heat
- Never leave hot oil unattended
- Don't put water in hot oil
- Have a lid nearby to smother flames
- Let oil cool completely before disposal
