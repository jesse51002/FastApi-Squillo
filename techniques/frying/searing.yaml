id: a9e56af5-6b6f-4737-b64f-164d8fc42447
name: Searing
description: Browning the surface of food at high temperature to create a flavorful
  crust
difficulty: 2
tips:
- Creates Maillard reaction - complex flavors from amino acids and sugars
- Use high heat, pat food dry, don't move food until crust forms
- Common for steaks and proteins
- Searing doesn't 'seal in juices' but does create delicious flavor and texture
