name: Searing
description: Using high heat to brown the surface of food and create a flavorful crust through the Maillard reaction, which creates complex flavors from amino acids and sugars. Despite common myth, searing doesn't seal in juices, but it does create delicious flavor and texture that improves the overall dish, especially for proteins like steaks.
difficulty: 2
tips:
- Creates Maillard reaction - complex flavors from amino acids and sugars
- Use high heat, pat food dry, don't move food until crust forms
- Common for steaks and proteins
- Searing doesn't 'seal in juices' but does create delicious flavor and texture
