name: Sauteing
description: Cooking food quickly in a small amount of fat over high heat while constantly moving it, named from the French word "sauter" meaning "to jump" because food should move freely in the pan. Success requires proper technique—pan and oil must be hot before food is added, food must be patted dry, and the pan should never be overcrowded or the food will steam instead of brown.
difficulty: 2
tips:
- From French 'sauter' meaning 'to jump'
- Use high heat and keep food moving
- Pan should be hot before adding oil, oil hot before adding food
- Don't overcrowd - food will steam instead of brown
- Pat food dry for better browning
