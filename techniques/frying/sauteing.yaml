id: 0f0a6673-29c2-40ae-9a5e-6b40b496d5a2
name: Sauteing
description: Cooking food quickly in a small amount of fat over high heat
difficulty: 2
tips:
- From French 'sauter' meaning 'to jump'
- Use high heat and keep food moving
- Pan should be hot before adding oil, oil hot before adding food
- Don't overcrowd - food will steam instead of brown
- Pat food dry for better browning
