name: Bell pepper seed removal
description: Removing seeds and white ribs from bell peppers using either a coring method (cutting around the stem and shaking out seeds) or a halving method (cutting in half and removing ribs and seeds by hand). Both techniques preserve the pepper flesh while eliminating the bitter seeds and membranes that would detract from your dish.
difficulty: 1
tips:
- Cut around the stem in a square or circle, pull out the core, then shake out remaining
  seeds
- Alternatively, cut in half and remove the white ribs and seeds with your fingers
  or a knife
