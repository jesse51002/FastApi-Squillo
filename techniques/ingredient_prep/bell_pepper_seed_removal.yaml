name: Bell pepper seed removal
description: Efficiently removing seeds and ribs from bell peppers
difficulty: 1
tips:
- Cut around the stem in a square or circle, pull out the core, then shake out remaining
  seeds
- Alternatively, cut in half and remove the white ribs and seeds with your fingers
  or a knife
