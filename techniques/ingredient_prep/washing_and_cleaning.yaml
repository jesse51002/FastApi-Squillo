name: Washing & Cleaning
description: Washing produce under cold running water with a brush for root vegetables, then patting dry—while treating delicate items like mushrooms with care by wiping with a damp cloth rather than soaking. Beyond food prep, proper sanitation includes washing hands, cutting boards, and utensils between handling raw and cooked foods to prevent cross-contamination.
difficulty: 1
tips:
- Wash produce under cold running water
- Use a brush for root vegetables
- Pat dry with clean towels
- Don't wash mushrooms under water - wipe with damp cloth
- Wash hands, cutting boards, and utensils between raw and cooked foods
