name: Ginger prepping
description: Techniques for peeling and preparing fresh ginger root
difficulty: 2
tips:
- Use a spoon edge to scrape off the thin skin, which preserves more flesh than peeling
- Slice against the grain for tender pieces, or grate for maximum flavor release
- Fresh ginger is more aromatic than dried
