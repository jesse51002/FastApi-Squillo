name: Ginger prepping
description: Preparing fresh ginger root by gently scraping the thin skin with a spoon edge (preserving more flesh than traditional peeling), then slicing against the grain for tender pieces or grating for maximum flavor release. Fresh ginger's superior aroma and pungency compared to dried makes proper preparation worthwhile, unlocking its bright, spicy qualities.
difficulty: 2
tips:
- Use a spoon edge to scrape off the thin skin, which preserves more flesh than peeling
- Slice against the grain for tender pieces, or grate for maximum flavor release
- Fresh ginger is more aromatic than dried
